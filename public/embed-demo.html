<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Embed demo</title>
    <style>
      body {
        margin: 0;
        padding: 32px 24px 48px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #222;
        background: #f4f4f2;
        line-height: 1.5;
      }
      main { max-width: 1040px; margin: 0 auto; }
      h1 { font-size: 24px; margin: 0 0 4px; }
      p { color: #555; margin: 0 0 24px; max-width: 60ch; }
      /* Two of them side by side where there is room, one above the other
         where there is not -- the embed itself takes whatever width it is
         handed. The height is given as a ratio rather than a number of
         pixels, so a narrow column does not leave the board floating in a
         frame built for a wide one. */
      .embeds {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 24px;
      }
      figure { margin: 0; }
      figcaption { font-size: 13px; color: #666; margin-bottom: 8px; }
      iframe {
        width: 100%;
        aspect-ratio: 4 / 5;
        border: 1px solid #d7d7d2;
        border-radius: 10px;
        background: #fffdf2;
      }
      pre {
        margin: 32px 0 0;
        padding: 12px 14px;
        overflow-x: auto;
        font-size: 13px;
        background: #fff;
        border: 1px solid #d7d7d2;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Embed demo</h1>
      <p>Two problems, each an iframe of <code>/embed?id=&lt;YACPDB id&gt;</code> and nothing else.</p>

      <div class="embeds">
        <figure>
          <figcaption>Helpmate in 2 — /embed?id=338114</figcaption>
          <iframe src="/embed/?id=338114" title="Helpmate in 2" loading="lazy"></iframe>
        </figure>
        <figure>
          <figcaption>Mate in 2 — /embed?id=632615</figcaption>
          <iframe src="/embed/?id=632615" title="Mate in 2" loading="lazy"></iframe>
        </figure>
      </div>

      <pre>&lt;iframe src="https://arcade.chessproblem.org/embed?id=338114"
        style="width:100%; aspect-ratio:4/5; border:0"
        title="Chess problem"&gt;&lt;/iframe&gt;</pre>
    </main>
  </body>
</html>
