<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Embed demo</title>
    <style>
      body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #f4f4f2; color: #222; }
      main { max-width: 560px; margin: 0 auto; }
      /* What a host page writes: a width of its own and a height to match.
         The board inside takes whatever is left over, so any height works. */
      iframe { width: 100%; height: 520px; border: 1px solid #ccc; border-radius: 8px; }
      p { font-size: 14px; color: #555; }
    </style>
  </head>
  <body>
    <main>
      <h1>Embed demo</h1>
      <p>An iframe of <code>/embed?id=3684</code> and nothing else.</p>
      <iframe src="/embed/?id=3684" title="Chess problem" loading="lazy"></iframe>
    </main>
  </body>
</html>
